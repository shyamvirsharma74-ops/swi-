
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>SVR AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f3f5fb; color: #18223a;
    }
    header {
      padding: 20px; background: #111827;
      color: white; font-size: 24px; font-weight: bold;
    }
    main { max-width: 700px; margin: auto; padding: 16px; }
    #chat {
      min-height: 55vh; display: flex; flex-direction: column;
      gap: 12px; padding: 12px 0;
    }
    .msg {
      padding: 14px; border-radius: 16px;
      max-width: 90%; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .ai { background: white; align-self: flex-start; }
    .user { background: #dce5ff; align-self: flex-end; }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0; flex: 1; padding: 14px;
      border: 1px solid #ccd2e0; border-radius: 12px;
      font-size: 16px;
    }
    button {
      border: 0; border-radius: 12px; padding: 14px;
      background: #4f46e5; color: white; font-size: 16px;
    }
    #note { color: #596579; font-size: 13px; }
  </style>
</head>
<body>
  <header>✦ SVR AI</header>
  <main>
    <p>नमस्ते! SVR AI में आपका स्वागत है।</p>
    <div id="chat" aria-live="polite">
      <div class="msg ai">नमस्ते! अपना सवाल लिखिए। यह अभी डेमो मोड है।</div>
    </div>
    <form id="form">
      <input id="question" placeholder="यहाँ सवाल लिखें..."
             autocomplete="off" required>
      <button type="submit">भेजें</button>
    </form>
    <p id="note">डेमो संस्करण — असली AI अभी कनेक्ट नहीं है।</p>
    <button id="clear" type="button">नई चैट</button>
  </main>
  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#form");
    const input = document.querySelector("#question");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, "user");
      input.value = "";

      let answer = "यह SVR AI का डेमो है। असली जवाब पाने के लिए AI मॉडल जोड़ना होगा।";
      if (/नमस्ते|hello|^hi$/i.test(question)) {
        answer = "नमस्ते! SVR AI में आपका स्वागत है।";
      } else if (/तुम्हारा नाम|आपका नाम|your name/i.test(question)) {
        answer = "मेरा नाम SVR AI है।";
      }
      addMessage(answer, "ai");
    });

    document.querySelector("#clear").addEventListener("click", () => {
      chat.replaceChildren();
      addMessage("नई चैट शुरू हो गई। अपना सवाल लिखें।", "ai");
    });
  </script>
</body>
</html>
